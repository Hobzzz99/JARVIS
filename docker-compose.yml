services:
  api:
    build: .
    container_name: jarvis-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # The frontend dev server needs to be an allowed origin.
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      API_PORT: "8000"
    volumes:
      # Briefing archive and preferences survive container restarts.
      - jarvis-memory:/app/memory
      # HuggingFace weights (~1-2 GB) download once, not on every rebuild.
      - hf-cache:/home/jarvis/.cache/huggingface
    restart: unless-stopped

volumes:
  jarvis-memory:
  hf-cache:
